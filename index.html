<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Kontrol Relay Saya</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f3f5; padding: 20px; }
        .box { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { width: 80%; padding: 15px; margin: 10px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-on { background: #2ecc71; }
        .btn-off { background: #e74c3c; }
    </style>
</head>
<body>

<div class="box">
    <h2>Kontrol Jarak Jauh</h2>
    <p>Web Kustom ESP32-C3 + ULN2803</p>
    <hr>
    
    <h3>Relay 1</h3>
    <button class="btn-on" onclick="setRelay('relay1', 1)">NYALAKAN (ON)</button>
    <button class="btn-off" onclick="setRelay('relay1', 0)">MATIKAN (OFF)</button>

    <h3>Relay 2</h3>
    <button class="btn-on" onclick="setRelay('relay2', 1)">NYALAKAN (ON)</button>
    <button class="btn-off" onclick="setRelay('relay2', 0)">MATIKAN (OFF)</button>

    <h3>Relay 3</h3>
    <button class="btn-on" onclick="setRelay('relay3', 1)">NYALAKAN (ON)</button>
    <button class="btn-off" onclick="setRelay('relay3', 0)">MATIKAN (OFF)</button>

    <h3>Relay 4</h3>
    <button class="btn-on" onclick="setRelay('relay4', 1)">NYALAKAN (ON)</button>
    <button class="btn-off" onclick="setRelay('relay4', 0)">MATIKAN (OFF)</button>
</div>

<script>
    // FIX: URL Firebase resmi Anda sudah dimasukkan dengan lengkap dan benar
    const firebaseURL = "https://firebasedatabase.app"; 

    function setRelay(namaRelay, nilai) {
        // Mengirim data 0 atau 1 langsung ke database Google via HTTP PUT
        fetch(`${firebaseURL}${namaRelay}.json`, {
            method: 'PUT',
            body: JSON.stringify(nilai)
        })
        .then(res => {
            console.log(`${namaRelay} berhasil diubah ke ${nilai}`);
            alert(`${namaRelay} berhasil diubah ke posisi ${nilai === 1 ? 'ON' : 'OFF'}`);
        })
        .catch(err => {
            alert('Gagal mengirim perintah! Pastikan Anda membuka web ini lewat link GitHub Pages, bukan file lokal.');
            console.error(err);
        });
    }
</script>
</body>
</html>
